<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicPulse — Offline Mode</title>
  <style>
    :root {
      --bg: #0A0A0A;
      --card: #141414;
      --text: #FAF9F6;
      --muted: #888884;
      --brand: #D9381E;
      --border: #262626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: monospace;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--brand);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .footer {
      margin-top: 1.5rem;
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="badge">
    <span class="badge-dot"></span>
    <span>Municipal Dispatch Ledger · SC-01</span>
  </div>
  <div class="card">
    <h1>Device Currently Offline</h1>
    <p>CivicPulse is currently operating in local offline cached mode. Any reports filed while offline will sync once your cellular or Wi-Fi connection is re-established.</p>
    <button class="btn" onclick="window.location.reload()">Check Connection & Reconnect</button>
  </div>
  <div class="footer">CIVICPULSE PROTOCOL v2.4 · OPEN311 COMPLIANT</div>
</body>
</html>
